name: CI
on:
  push:
    # `multicode` is the 2.0.0-DEV line (master + the non-RAMSES frontends). It is never
    # registered, but users install it by URL, so it needs the same smoke run as master.
    branches: [master, main, multicode]
  pull_request:
    branches: [master, main, multicode]

# Opt JS-based actions into Node.js 24 ahead of GitHub's forced switch (2026-06-16).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# CI runners do not have access to the RAMSES simulation data on the
# maintainer's external drive, so the full test suite cannot run here.
# We run the "smoke" subset: every data-free tier of runtests.jl — Aqua and the
# unit systems, but also the synthetic-HDF5 reader contracts (GADGET/AREPO,
# Chombo), the reader registry, the IO layer and the mera-file round-trips. That
# is real file I/O on synthetic fixtures, not a load-only check. Full coverage is
# collected locally and uploaded to Codecov by scripts/run_local_coverage.sh.

jobs:
  smoke:
    name: Smoke (Julia ${{ matrix.version }} - ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'  # LTS / minimum supported
          - '1.11'
          - '1.12'  # latest stable
        os:
          - ubuntu-latest
          - macos-latest
          # Every supported version is tested on every claimed platform. 1.10 is
          # the declared floor (Project.toml) and 1.12 is what the README
          # recommends — both are public promises, so neither may go untested on
          # a platform we advertise. Windows is where this pays: HDF5/JLD2/LZ4
          # binaries, path separators, and the rule that an open file cannot be
          # deleted. The data-free tiers exercise all of it (36 mktempdir, 23
          # h5open, savedata round-trips), including the group-catalogue lookup
          # that walks to a snapshot's PARENT directory.
          - windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1

      - name: Smoke tests (no simulation data)
        env:
          MERA_SMOKE_ONLY: "1"
          JULIA_NUM_THREADS: "4"   # exercise the threaded code paths (max_threads kwargs)
        run: julia --project -e 'using Pkg; Pkg.test("Mera")'

# Docs are built + deployed by the dedicated `documentation.yml` workflow
# (which has `permissions: contents: write`, and builds on PRs too). A second
# docs/deploy job here raced it to push gh-pages — whichever lost got a
# non-fast-forward rejection, so master pushes failed intermittently. Removed
# to leave a single deployer.
