name: Documentation

on:
  push:
    branches:
      - master     # the 1.x release line, published as `dev` and `stable`
      - multicode  # the multi-code line, published into its own `multicode` folder
    tags: '*'
  pull_request:

# master, multicode and tag builds all deploy to the same gh-pages branch. Run them one at a
# time: pushed together, master and multicode once raced, and the second deploy was rejected.
# GitHub keeps one running and one waiting run per group, so a third deploy started while two
# are queued replaces the waiting one. Pull requests build without deploying and run freely.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.ref) || 'docs-deploy' }}
  cancel-in-progress: false

# Opt JS-based actions into Node.js 24 ahead of GitHub's forced switch (2026-06-16).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - name: Install dependencies
        run: julia --project=docs/ -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # If authenticating with GitHub Actions token
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }} # If authenticating with SSH deploy key
        run: julia --project=docs/ docs/make.jl
