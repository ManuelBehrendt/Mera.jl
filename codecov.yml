codecov:
  require_ci_to_pass: false

# Two independent measurements, reported separately.
#
#   ci-smoke   what GitHub Actions can actually run: the data-free tier only, because the
#              simulation data is far too large for a hosted runner.
#   local-full the whole suite including the data-backed tier, measured on the maintainer's
#              machine with MERA_TEST_DATA mounted, and uploaded by
#              scripts/run_local_coverage.sh.
#
# carryforward is essential here. The two are uploaded at different times, so without it a push
# that reports only ci-smoke would make local-full look empty, and the project total would sag
# and recover for no real reason.
flags:
  ci-smoke:
    paths:
      - src/
    carryforward: true
  local-full:
    paths:
      - src/
    carryforward: true

coverage:
  status:
    project:
      default:
        # Fail if coverage drops more than 2% from baseline
        threshold: 2%
    patch:
      default:
        # New code should have at least 50% coverage
        target: 50%

ignore:
  - "src/dev/**"
  - "src/benchmarks/**"
  - "src/functions/optimization/**"
  - "src/functions/visualization/**"
  - "src/functions/projection/profile_hydro_minimal.jl"
  - "src/functions/projection/projection_hydro_deprecated.jl"
  - "src/sounds/**"
  - "test/**"
  - "docs/**"
  - "calc_coverage.jl"
